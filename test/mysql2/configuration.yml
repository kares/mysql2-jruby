# ERB template rendered into <mysql2-checkout>/spec/configuration.yml by `rake mysql2:spec`
# when that file is absent (it's git-ignored in the mysql2 repo). The suite reads the `root:`
# key via plain YAML.load_file, so the rake task renders this against the environment first.
root:
  host: <%= ENV['MYSQL_HOST'] || '127.0.0.1' %>
  port: <%= (ENV['MYSQL_PORT'] || 13306).to_i %>
  username: <%= ENV['MYSQL_USER'] || 'root' %>
  password: <%= ENV['MYSQL_PASSWORD'] || 'root' %>
  database: <%= ENV['MYSQL_DATABASE'] || 'test' %>
