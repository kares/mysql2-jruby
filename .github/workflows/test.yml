name: test

on:
  push:
    branches: [main]

jobs:
  test:
    name: "rake test (MySQL ${{ matrix.mysql }}, Connector/J ${{ matrix.connector }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql: '8.0'
            connector: '8.4.0'
          - mysql: '8.4'
            connector: '9.7.0'

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      CONNECTOR_VERSION: ${{ matrix.connector }}
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: test
      SPEC_OPTS: --force-color
      TEST_OPTS: --verbose

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # fetch the ./mysql2 spec-suite checkout

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up JRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: jruby-10.0.7.0
          bundler-cache: false

      - name: Compile
        run: rake connector compile

      - name: Run (in-house) tests
        run: rake test

      - name: Install rspec
        run: gem install rspec -v "~>3.2" --no-document

      # Runs the curated subset (test/mysql2/rspec_excludes.rb)
      - name: Run mysql2 specs
        run: rake mysql2:db:build mysql2:spec

  rails:
    name: "rails test (Rails ${{ matrix.rails }}, ${{ matrix.jruby }}, Java ${{ matrix.java }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # exact tag pins; excludes (test/rails/excludes/mysql2) are tuned for v8.0.5
          - rails: 'v7.2.3.1'
            jruby: jruby-9.4.15.0
            java: '11'
          - rails: 'v8.0.5'
            jruby: jruby-10.0.7.0
            java: '21'
          - rails: 'v8.1.4.1'
            jruby: jruby-10.1.3.0
            java: '21'

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      CONNECTOR_VERSION: '9.7.0'
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      TESTOPTS: --verbose

    steps:
      - uses: actions/checkout@v4 # this gem (no submodules needed for Rails suite)

      # a separate checkout of the Rails repo at the matrix version, into ./rails
      - name: Check out Rails ${{ matrix.rails }}
        uses: actions/checkout@v4
        with:
          repository: rails/rails
          ref: ${{ matrix.rails }}
          path: rails
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up JRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.jruby }}
          bundler-cache: false

      - name: Compile
        run: rake connector compile

      - name: Install Rails test dependencies
        run: | # re-resolve the bundle per Rails version
          rm -f test/rails/Gemfile.lock
          rake rails:bundle

      - name: Create databases
        run: rake rails:db:build

      - name: Run Rails ActiveRecord tests
        run: rake rails:test
