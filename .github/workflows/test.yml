name: test

on:
  push:
    branches: [main]

jobs:
  test:
    name: "rake test (MySQL ${{ matrix.mysql }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']

    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up JRuby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: jruby-10.0.6.0
          bundler-cache: false

      - name: Prepare
        run: rake connector compile

      - name: Run (in-house) tests
        run: rake test
